<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local session example</title>
<style>body{font:17px system-ui;max-width:420px;margin:4rem auto;padding:1rem}label{display:block;margin-top:1rem}input,button{font:inherit;padding:.6rem;width:100%;box-sizing:border-box}button{margin-top:1.5rem}</style>
<h1>Local session example</h1>
<p>Use username <code>zap</code> and password <code>awesome</code>.</p>
<p>This example allows one active session and 32 logins per server run.</p>
<form action="/login" method="post">
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button>Log in</button>
</form>
</html>
