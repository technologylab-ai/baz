<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" class="diagram diagram-wide" role="img" aria-labelledby="layers-title layers-desc">
<title id="layers-title">Baz and bounded/http are separate packages</title><desc id="layers-desc">Your application supplies shared state, endpoint instances, and a caller I/O capability. Baz provides the typed App API. bounded/http supplies parsing, scheduling, response reservations, and Linux io_uring, macOS kqueue, or Windows IOCP transport. Finite blocking services use explicit fixed application workers.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172f3e">
<g stroke="#cdd3d0" fill="#efeee6"><rect x="1" y="1" width="604" height="73"/><rect x="635" y="1" width="264" height="73"/><rect x="635" y="103" width="264" height="166"/></g>
<text x="25" y="32" font-size="19">Your application</text><text x="25" y="55" font-size="13" fill="#4e6370">Shared state · endpoint structs · explicit application scratch</text>
<text x="658" y="32" font-size="19">Caller’s std.Io</text><text x="658" y="55" font-size="13" fill="#4e6370">Startup + application services</text>
<path d="M303 74v29m464-29v29" stroke="#9caaa9"/>
<rect x="1" y="103" width="604" height="73" fill="#172f3e"/>
<text x="25" y="134" font-size="22" fill="#f8f7f1">Baz</text><text x="25" y="158" font-size="13" fill="#d6dedb">App(Shared) · router · request views · response drafts</text>
<text x="658" y="138" font-size="17">Explicit fixed workers</text><text x="658" y="165" font-size="13" fill="#4e6370">For finite blocking services.</text><text x="658" y="188" font-size="13" fill="#4e6370">Application code and provider</text><text x="658" y="208" font-size="13" fill="#4e6370">own their resource behavior.</text>
<text x="658" y="247" font-size="11" fill="#bc3c20" font-family="ui-monospace, monospace">NO AUTOMATIC CANCELLATION</text>
<path d="M605 140h30M303 176v20" stroke="#9caaa9"/>
<rect x="1" y="196" width="604" height="73" fill="#f8f7f1" stroke="#bc3c20"/>
<text x="25" y="227" font-size="22">bounded/http</text><text x="25" y="251" font-size="13" fill="#4e6370">HTTP parser · scheduler · reservations · connection ownership</text>
<path d="M99 269v25m204-25v25m204-25v25" stroke="#9caaa9"/>
<g stroke="#cdd3d0" fill="#efeee6"><rect x="1" y="294" width="196" height="45"/><rect x="205" y="294" width="196" height="45"/><rect x="409" y="294" width="196" height="45"/></g>
<g font-size="13" text-anchor="middle"><text x="99" y="322">Linux · io_uring</text><text x="303" y="322">macOS · kqueue</text><text x="507" y="322">Windows · IOCP</text></g>
<text x="900" y="356" text-anchor="end" font-size="10" fill="#4e6370" font-family="ui-monospace, monospace">CURRENT VERIFIED BAZ BASELINE</text>
</g></svg>
