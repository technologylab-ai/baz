<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="slots-title slots-desc">
<title id="slots-title">Two slots, three clients</title><desc id="slots-desc">With A in slot one and B in slot two, the server closes C. After A closes, its slot can be reused by C while B stays connected. The configured capacity is always two.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172f3e">
<g font-family="ui-monospace, monospace" font-size="13" fill="#4e6370"><text x="260" y="24">SLOT 1</text><text x="480" y="24">SLOT 2</text><text x="700" y="24">TRY CLIENT C</text></g>
<g fill="#172f3e"><rect x="240" y="48" width="180" height="70"/><rect x="460" y="48" width="180" height="70"/><rect x="460" y="155" width="180" height="70"/></g>
<rect x="680" y="48" width="218" height="70" fill="#f6e7df" stroke="#bc3c20"/>
<rect x="240" y="155" width="180" height="70" fill="#efeee6" stroke="#cdd3d0"/>
<rect x="680" y="155" width="218" height="70" fill="#efeee6" stroke="#cdd3d0"/>
<g font-size="24"><text x="1" y="77">Both slots full</text><text x="1" y="184">After A closes</text><text x="260" y="92" fill="#f8f7f1">A</text><text x="480" y="92" fill="#f8f7f1">B</text><text x="260" y="199">C</text><text x="480" y="199" fill="#f8f7f1">B</text><text x="700" y="92" fill="#bc3c20">C: closed</text><text x="700" y="199">C: HTTP 200</text></g>
<g font-size="14" fill="#4e6370"><text x="1" y="102">A and B stay connected.</text><text x="1" y="209">C reuses released capacity.</text></g>
<g fill="none" stroke="#9caaa9" stroke-width="2"><path d="M641 83h31m-7-5 7 5-7 5M641 190h31m-7-5 7 5-7 5"/></g>
<path d="M1 260h898" stroke="#cdd3d0"/>
<text x="450" y="299" text-anchor="middle" fill="#bc3c20" font-family="ui-monospace, monospace" font-size="13">THE CONNECTIONS CHANGE. THE CAPACITY STAYS AT TWO.</text>
</g></svg>
